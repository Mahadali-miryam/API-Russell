
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Catways - API Russell</title>
</head>
<body>

    <h1>Gestion des Catways</h1>

    <p><a href="dashboard.html">Retour au tableau de bord</a></p>

    <h2>Liste des catways</h2>
    <div id="catwaysList"></div>

    <h2>Ajouter un catway</h2>

    <form id="createCatwayForm">
        <label for="catwayNumber">Numéro du catway :</label>
        <input type="number" id="catwayNumber" required>
        <br><br>

        <label for="type">Type :</label>
        <select id="type" required>
            <option value="long">Long</option>
            <option value="short">Short</option>
        </select>
        <br><br>

        <label for="catwayState">État :</label>
        <input type="text" id="catwayState" required>
        <br><br>

        <button type="submit">Ajouter le catway</button>
    </form>

    <h2>Modifier l'état d'un catway</h2>

    <form id="updateCatwayForm">
        <label for="updateCatwayId">Identifiant du catway :</label>
        <input type="text" id="updateCatwayId" required>
        <br><br>

        <label for="newCatwayState">Nouvel état :</label>
        <input type="text" id="newCatwayState" required>
        <br><br>

        <button type="submit">Modifier l'état</button>
    </form>

    <h2>Supprimer un catway</h2>

    <form id="deleteCatwayForm">
        <label for="deleteCatwayId">Identifiant du catway :</label>
        <input type="text" id="deleteCatwayId" required>
        <br><br>

        <button type="submit">Supprimer le catway</button>
    </form>

    <h2>Consulter un catway</h2>

    <form id="getCatwayForm">
        <label for="getCatwayId">Identifiant du catway :</label>
        <input type="text" id="getCatwayId" required>
        <br><br>

        <button type="submit">Consulter</button>
    </form>

    <div id="catwayDetails"></div>

    <p id="message"></p>

    <script src="js/catways.js"></script>

</body>
</html>
