
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des réservations - API Russell</title>
</head>
<body>

    <h1>Gestion des réservations</h1>

    <p><a href="dashboard.html">Retour au tableau de bord</a></p>

    <h2>Liste des réservations</h2>

    <form id="listReservationsForm">
        <label for="listCatwayNumber">Numéro du catway :</label>
        <input type="number" id="listCatwayNumber" required>
        <button type="submit">Afficher les réservations</button>
    </form>

    <div id="reservationsList"></div>

    <h2>Ajouter une réservation</h2>
    <form id="createReservationForm">
        <label for="catwayNumber">Numéro du catway :</label>
        <input type="number" id="catwayNumber" required>

        <label for="clientName">Nom du client :</label>
        <input type="text" id="clientName" required>

        <label for="boatName">Nom du bateau :</label>
        <input type="text" id="boatName" required>

        <label for="checkIn">Date d'arrivée :</label>
        <input type="date" id="checkIn" required>

        <label for="checkOut">Date de départ :</label>
        <input type="date" id="checkOut" required>

        <button type="submit">Ajouter la réservation</button>
    </form>

    <h2>Consulter une réservation</h2>
    <form id="getReservationForm">
        <label for="getCatwayNumber">Numéro du catway :</label>
        <input type="number" id="getCatwayNumber" required>

        <label for="getReservationId">Identifiant de la réservation :</label>
        <input type="text" id="getReservationId" required>

        <button type="submit">Consulter</button>
    </form>

    <div id="reservationDetails"></div>

    <h2>Supprimer une réservation</h2>
    <form id="deleteReservationForm">
        <label for="deleteCatwayNumber">Numéro du catway :</label>
        <input type="number" id="deleteCatwayNumber" required>

        <label for="deleteReservationId">Identifiant de la réservation :</label>
        <input type="text" id="deleteReservationId" required>

        <button type="submit">Supprimer</button>
    </form>

    <p id="message"></p>

    <script src="js/reservations.js"></script>
</body>
</html>
