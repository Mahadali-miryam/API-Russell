
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Russell - Tableau de bord</title>
</head>
<body>
    <h1>Tableau de bord - Port de plaisance Russell</h1>

    <p>Bienvenue dans l'espace de gestion du port.</p>

    <h2>Gestion des catways</h2>
    <ul>
        <li><a href="/catways">Consulter les catways</a></li>
    </ul>

    <h2>Gestion des réservations</h2>
    <ul>
        <li><a href="/reservations">Consulter les réservations</a></li>
    </ul>

    <h2>Gestion des utilisateurs</h2>

    <h3>Créer un utilisateur</h3>
    <form id="createUserForm">
        <label for="newName">Nom :</label>
        <input type="text" id="newName" required>

        <label for="newEmail">E-mail :</label>
        <input type="email" id="newEmail" required>

        <label for="newPassword">Mot de passe :</label>
        <input type="password" id="newPassword" required>

        <button type="submit">Créer</button>
    </form>
    <p id="createUserMessage"></p>

    <h3>Modifier un utilisateur</h3>
    <form id="updateUserForm">
        <label for="updateUserId">ID de l'utilisateur :</label>
        <input type="text" id="updateUserId" required>

        <label for="updateName">Nouveau nom :</label>
        <input type="text" id="updateName">

        <label for="updateEmail">Nouvel e-mail :</label>
        <input type="email" id="updateEmail">

        <label for="updatePassword">Nouveau mot de passe :</label>
        <input type="password" id="updatePassword">

        <button type="submit">Modifier</button>
    </form>
    <p id="updateUserMessage"></p>

    <h3>Supprimer un utilisateur</h3>
    <form id="deleteUserForm">
        <label for="deleteUserId">ID de l'utilisateur :</label>
        <input type="text" id="deleteUserId" required>

        <button type="submit">Supprimer</button>
    </form>
    <p id="deleteUserMessage"></p>

    <button id="logoutButton">Se déconnecter</button>

    <script src="js/dashboard.js"></script>
</body>
</html>
